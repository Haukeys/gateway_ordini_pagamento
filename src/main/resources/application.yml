server:
  port: ${GATEWAY_PORT} # Le port unique et public de votre Gateway

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:

        # ROUTE POUR LE SERVICE ORDINI (Commandes)
        - id: ordine_route
          uri: http://${GESTIONE_ORDINI_HOST}:${GESTIONE_ORDINI_PORT} # Nom du conteneur Docker + son port interne 8080
          predicates:
            # On accepte le chemin exact ET les sous-chemins
            - Path=/${PATH_ORDINI}/**

        # ROUTE POUR LE SERVICE PAGAMENTO (Paiement)
        - id: pagamento_route
          uri: http://${GESTIONE_PAGAMENTO_HOST}:${GESTIONE_PAGAMENTO_PORT} # Nom du conteneur Docker + son port interne 8080
          predicates:
            # On accepte le chemin exact ET les sous-chemins
            - Path=/${PATH_PAGAMENTO}/**
